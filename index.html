<style>
/* =============================================
   MantaLogger Navbar
   ============================================= */

.mlb-nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  height: 68px;
  padding: 0 3rem;
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(0,0,0,0.25);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(255,255,255,0.1);
  transition: background 0.4s ease, border-color 0.4s ease;
}
.mlb-nav.scrolled {
  background: rgba(255,253,247,0.95);
  border-bottom: 1px solid rgba(26,127,168,0.1);
}
.mlb-nav-logo img {
  height: 48px;
  filter: invert(1);
  transition: filter 0.4s ease;
}
.mlb-nav.scrolled .mlb-nav-logo img { filter: none; }
.mlb-nav-links {
  display: flex; align-items: center; gap: 0.3rem;
}
.mlb-nav-links a, .mlb-nav-contact-btn {
  color: rgba(255,253,247,0.9);
  text-decoration: none; font-size: 0.9rem; font-weight: 500;
  font-family: 'Inter', sans-serif;
  padding: 0.45rem 0.9rem; border-radius: 8px;
  background: none; border: none; cursor: pointer;
  display: inline-flex; align-items: center; gap: 4px;
  transition: background 0.2s ease, color 0.4s ease;
}
.mlb-nav.scrolled .mlb-nav-links a,
.mlb-nav.scrolled .mlb-nav-contact-btn { color: #5A6B60; }
.mlb-nav-links a:hover { background: rgba(255,255,255,0.12); }
.mlb-nav.scrolled .mlb-nav-links a:hover,
.mlb-nav.scrolled .mlb-nav-contact-btn:hover { background: rgba(26,127,168,0.08); }
.mlb-nav-contact-btn:hover { background: rgba(255,255,255,0.12); }

.mlb-contact-wrap { position: relative; }
.mlb-contact-dropdown {
  display: none;
  position: absolute; top: calc(100% + 4px); left: 0;
  background: #FFFDF7; border-radius: 12px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.12);
  border: 1px solid rgba(26,127,168,0.1);
  padding: 0.5rem; min-width: 180px;
}
.mlb-contact-wrap:hover .mlb-contact-dropdown { display: block; }
.mlb-contact-dropdown a {
  display: block; padding: 0.6rem 0.9rem;
  color: #2C3E35; font-size: 0.88rem; font-weight: 500;
  border-radius: 8px; transition: background 0.15s;
}
.mlb-contact-dropdown a:hover { background: rgba(26,127,168,0.07); color: #2C3E35; }

.mlb-btn-app {
  background: linear-gradient(135deg, #1A7FA8, #0D5C7A) !important;
  color: #FFFDF7 !important;
  padding: 0.5rem 1.1rem !important;
  border-radius: 50px !important;
  font-size: 0.85rem !important; font-weight: 600 !important;
  margin-left: 0.5rem;
  transition: box-shadow 0.2s, transform 0.15s !important;
}
.mlb-btn-app:hover { box-shadow: 0 6px 24px rgba(26,127,168,0.4) !important; transform: scale(1.05); }

.mlb-btn-buy {
  background: #FFE066 !important;
  color: #0D5C7A !important;
  padding: 0.5rem 1.1rem !important;
  border-radius: 50px !important;
  font-size: 0.85rem !important; font-weight: 700 !important;
  margin-left: 0.3rem;
  transition: box-shadow 0.2s, transform 0.15s !important;
}
.mlb-btn-buy:hover { box-shadow: 0 6px 24px rgba(255,224,102,0.4) !important; transform: scale(1.05); }

/* push page content below fixed navbar */
.mlb-nav + .ml-blog-root .blog-hero { padding-top: 164px; }

/* =============================================
   MantaLogger Blog — Inline Styles
   Scoped til .ml-blog-root
   ============================================= */

.ml-blog-root {
  --bg:             #FFFDF7;
  --bg-2:           #F5EDD6;
  --bg-3:           #E8D9B5;
  --border:         rgba(26,127,168,.08);
  --border-med:     rgba(26,127,168,.18);
  --text-primary:   #2C3E35;
  --text-secondary: #5A6B60;
  --text-muted:     #8A9B90;
  --accent:         #1A7FA8;
  --accent-hover:   #0D5C7A;
  --accent-muted:   rgba(26,127,168,.10);
  --font-sans:      'Inter', 'Helvetica Neue', Arial, sans-serif;
  --font-serif:     'Playfair Display', Georgia, serif;
  --max-w:          1200px;
  --radius-sm:      10px;
  --radius-md:      18px;
  --radius-lg:      22px;
  --radius-pill:    999px;
  --shadow-sm:      0 2px 8px rgba(26,127,168,.10);
  --shadow-md:      0 8px 32px rgba(26,127,168,.15);
  --shadow-lg:      0 20px 60px rgba(26,127,168,.20);
  --gap:            24px;
  --section-gap:    96px;
}

.ml-blog-root {
  background: var(--bg);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
.ml-blog-root *, .ml-blog-root *::before, .ml-blog-root *::after {
  box-sizing: border-box; margin: 0; padding: 0;
}
.ml-blog-root img   { display: block; max-width: 100%; height: auto; }
.ml-blog-root a     { color: inherit; text-decoration: none; }
.ml-blog-root button{ cursor: pointer; border: none; background: none; font-family: inherit; }
.ml-blog-root ul    { list-style: none; }

/* ===== LAYOUT ===== */
.ml-blog-root .mlb-container {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 0 24px;
}
.ml-blog-root .section-label {
  font-size: 11px; font-weight: 700;
  letter-spacing: .12em; text-transform: uppercase;
  color: var(--text-muted); margin-bottom: 32px;
}

/* ===== LOADING / ERROR / SKELETON ===== */
.ml-blog-root .mlb-loading {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 80px 24px; gap: 18px; color: var(--text-muted);
  font-size: 15px;
}
.ml-blog-root .mlb-spinner {
  width: 36px; height: 36px;
  border: 3px solid var(--bg-3);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: mlbSpin .7s linear infinite;
}
.ml-blog-root .mlb-error {
  text-align: center; padding: 64px 24px;
  color: var(--text-secondary); font-size: 15px;
}
.ml-blog-root .mlb-error strong { display: block; font-size: 18px; margin-bottom: 8px; color: var(--text-primary); }

/* Skeleton shimmer */
.ml-blog-root .skeleton {
  background: linear-gradient(90deg, var(--bg-2) 25%, var(--bg-3) 50%, var(--bg-2) 75%);
  background-size: 200% 100%;
  animation: mlbShimmer 1.4s infinite;
  border-radius: 8px;
}
.ml-blog-root .skeleton-featured {
  height: 480px; border-radius: var(--radius-lg); margin-bottom: 64px;
}
.ml-blog-root .skeleton-grid {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: var(--gap);
}
.ml-blog-root .skeleton-card {
  height: 340px; border-radius: var(--radius-md);
}

/* ===== HERO ===== */
.ml-blog-root .blog-hero {
  padding: 96px 0 64px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.ml-blog-root .blog-hero::before {
  content: '';
  position: absolute; top: -120px; left: 50%;
  transform: translateX(-50%);
  width: 700px; height: 500px;
  background: radial-gradient(ellipse at center, rgba(26,127,168,.12) 0%, transparent 70%);
  pointer-events: none;
}
.ml-blog-root .hero-content { position: relative; z-index: 1; }
.ml-blog-root .hero-label {
  display: inline-block;
  font-size: 11px; font-weight: 700;
  letter-spacing: .14em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 20px;
  padding: 5px 14px;
  border: 1px solid rgba(26,127,168,.3);
  border-radius: var(--radius-pill);
}
.ml-blog-root .hero-title {
  font-family: var(--font-serif);
  font-size: clamp(36px,6vw,68px);
  font-weight: 800; letter-spacing: -.03em;
  line-height: 1.08; color: var(--text-primary); margin-bottom: 24px;
}
.ml-blog-root .hero-desc {
  max-width: 520px; margin: 0 auto 40px;
  font-size: 17px; color: var(--text-secondary); line-height: 1.7;
}
.ml-blog-root .filter-pills {
  display: flex; justify-content: center; flex-wrap: wrap; gap: 10px;
}
.ml-blog-root .pill {
  padding: 7px 18px; border-radius: var(--radius-pill);
  font-size: 13px; font-weight: 600;
  border: 1px solid var(--border-med);
  color: var(--text-secondary); background: var(--bg-2);
  transition: all .2s;
}
.ml-blog-root .pill:hover { border-color: var(--accent); color: var(--text-primary); }
.ml-blog-root .pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ===== FEATURED CARD ===== */
.ml-blog-root .featured-section { margin-bottom: 64px; }
.ml-blog-root .featured-card {
  display: block; position: relative;
  border-radius: var(--radius-lg); overflow: hidden;
  min-height: 480px; box-shadow: var(--shadow-lg);
  transition: transform .3s cubic-bezier(.25,.8,.25,1), box-shadow .3s;
}
.ml-blog-root .featured-card:hover { transform: translateY(-6px); box-shadow: 0 30px 80px rgba(0,0,0,.28); }
.ml-blog-root .featured-img {
  position: absolute; inset: 0;
  background-size: cover; background-position: center;
  transition: transform .5s ease;
}
.ml-blog-root .featured-card:hover .featured-img { transform: scale(1.03); }
.ml-blog-root .featured-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(8,9,12,.96) 0%, rgba(8,9,12,.6) 50%, rgba(8,9,12,.2) 100%);
}
.ml-blog-root .featured-body {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 40px; gap: 10px;
}
.ml-blog-root .featured-title {
  font-family: var(--font-serif);
  font-size: clamp(22px,3.5vw,34px);
  font-weight: 800; letter-spacing: -.02em;
  line-height: 1.2; color: #fff; max-width: 680px;
}
.ml-blog-root .featured-excerpt {
  font-size: 15px; color: rgba(255,255,255,.72);
  max-width: 580px; line-height: 1.6;
}
.ml-blog-root .read-more {
  display: inline-block;
  font-size: 13px; font-weight: 600;
  color: #fff; letter-spacing: .04em;
  margin-top: 8px;
  padding: 9px 20px;
  background: var(--accent);
  border-radius: var(--radius-pill);
  transition: background .2s, transform .15s, letter-spacing .2s;
  width: fit-content;
}
.ml-blog-root .featured-card:hover .read-more {
  background: var(--accent-hover);
  transform: translateY(-1px);
  letter-spacing: .07em;
}

/* Shared author row / tag / avatar */
.ml-blog-root .card-author-row {
  display: flex; align-items: center; gap: 10px; margin-bottom: 4px;
}
.ml-blog-root .card-author-row > div {
  display: flex; flex-direction: column; gap: 2px;
}
.ml-blog-root .author-name { font-size: 13px; font-weight: 600; color: rgba(255,255,255,.9); }
.ml-blog-root .post-date   { font-size: 12px; color: rgba(255,255,255,.5); }
.ml-blog-root .card-tag {
  display: inline-block;
  padding: 3px 10px; border-radius: var(--radius-pill);
  font-size: 11px; font-weight: 700;
  letter-spacing: .07em; text-transform: uppercase;
  background: var(--accent); color: #fff;
  border: 1px solid transparent;
  margin-bottom: 6px; width: fit-content;
}
.ml-blog-root .avatar {
  width: 34px; height: 34px; border-radius: 50%;
  object-fit: cover; border: 2px solid rgba(255,255,255,.25); flex-shrink: 0;
}

/* ===== BLOG GRID ===== */
.ml-blog-root .blog-section { margin-bottom: var(--section-gap); }
.ml-blog-root .blog-grid {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: var(--gap);
}
.ml-blog-root .blog-card {
  position: relative; display: block;
  border-radius: var(--radius-md); overflow: hidden;
  min-height: 340px; box-shadow: var(--shadow-md);
  transition: transform .3s cubic-bezier(.25,.8,.25,1), box-shadow .3s;
  background: var(--bg-2);
}
.ml-blog-root .blog-card:hover { transform: translateY(-5px) scale(1.008); box-shadow: var(--shadow-lg); }
.ml-blog-root .card-img {
  position: absolute; inset: 0;
  background-size: cover; background-position: center;
  transition: transform .5s ease;
}
.ml-blog-root .blog-card:hover .card-img { transform: scale(1.04); }
.ml-blog-root .card-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(8,9,12,.97) 0%, rgba(8,9,12,.65) 55%, rgba(8,9,12,.18) 100%);
}
.ml-blog-root .blog-card > .card-author-row {
  position: absolute; top: 20px; left: 20px; z-index: 2; margin-bottom: 0;
}
.ml-blog-root .card-body {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 24px; z-index: 2;
  display: flex; flex-direction: column; gap: 8px;
}
.ml-blog-root .card-title {
  font-family: var(--font-serif);
  font-size: 18px; font-weight: 700;
  letter-spacing: -.01em; line-height: 1.3; color: #fff;
}
.ml-blog-root .card-excerpt {
  font-size: 13px; color: rgba(255,255,255,.62);
  line-height: 1.55;
  display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden;
}
.ml-blog-root .load-more-wrap { text-align: center; margin-top: 48px; }
.ml-blog-root .btn-load-more {
  padding: 13px 36px; border-radius: var(--radius-pill);
  font-size: 14px; font-weight: 600;
  border: 1px solid var(--border-med);
  color: var(--text-secondary); background: var(--bg-2);
  transition: all .2s;
}
.ml-blog-root .btn-load-more:hover { border-color: var(--accent); color: var(--text-primary); background: var(--accent-muted); }
.ml-blog-root .btn-load-more:disabled { opacity: .5; pointer-events: none; }

/* ===== ANIMATIONS ===== */
@keyframes mlbFadeUp {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes mlbSpin {
  to { transform: rotate(360deg); }
}
@keyframes mlbShimmer {
  to { background-position: -200% 0; }
}

/* ===== TABLET ===== */
@media (max-width: 1024px) {
  .ml-blog-root .newsletter-inner { flex-direction: column; align-items: flex-start; gap: 24px; }
  .ml-blog-root .newsletter-form  { width: 100%; }
  .ml-blog-root .newsletter-form input { flex: 1; width: auto; }
}

/* ===== MOBILE ===== */
@media (max-width: 680px) {
  .ml-blog-root { --section-gap: 64px; }
  .ml-blog-root .blog-hero  { padding: 64px 0 44px; }
  .ml-blog-root .hero-title { font-size: 34px; }
  .ml-blog-root .hero-desc  { font-size: 15px; }
  .ml-blog-root .blog-grid  { grid-template-columns: 1fr; }
  .ml-blog-root .skeleton-grid { grid-template-columns: 1fr; }
  .ml-blog-root .featured-card  { min-height: 380px; }
  .ml-blog-root .featured-body  { padding: 24px; }
  .ml-blog-root .featured-title { font-size: 20px; }
  .ml-blog-root .newsletter-form { flex-direction: column; }
  .ml-blog-root .newsletter-form input { width: 100%; }
}
</style>

<script>
(function () {
  'use strict';

  /* =============================================
     ★  INDSTILLINGER — ret kun denne linje  ★
     Sæt din WordPress-sides URL herunder.
     Ingen trailing slash.
     ============================================= */
  var SITE_URL = 'https://mantalogger.com';

  /* =============================================
     Konfiguration — valgfri tilpasninger
     ============================================= */
  var PER_PAGE     = 6;    // artikler pr. side i grid
  var FALLBACK_IMG = 'https://images.unsplash.com/photo-1544551763-46a013bb70d5?w=1400&q=80';
  var FALLBACK_AVATAR = 'https://i.pravatar.cc/40?img=12';

  /* =============================================
     Intern tilstand
     ============================================= */
  var apiBase    = SITE_URL.replace(/\/$/, '') + '/wp-json/wp/v2';
  var currentCat = 0;       // 0 = alle
  var currentPage= 1;
  var totalPages = 1;
  var allPostsCache = {};   // cache pr. kategori+side

  /* =============================================
     Hjælpefunktioner
     ============================================= */
  function stripHtml(html) {
    var tmp = document.createElement('div');
    tmp.innerHTML = html || '';
    return (tmp.textContent || tmp.innerText || '').replace(/\n+/g,' ').trim();
  }

  function fmtDate(iso) {
    try {
      var d = new Date(iso);
      return d.toLocaleDateString('da-DK', { day:'numeric', month:'short', year:'numeric' });
    } catch(e) { return iso.slice(0,10); }
  }

  function readTime(html) {
    var words = stripHtml(html).split(/\s+/).length;
    return Math.max(1, Math.round(words / 200)) + ' min read';
  }

  function getFeaturedImg(post) {
    try { return post._embedded['wp:featuredmedia'][0].source_url; } catch(e) {}
    return FALLBACK_IMG;
  }

  function getAvatar(post) {
    try {
      var avs = post._embedded.author[0].avatar_urls;
      return avs['96'] || avs['48'] || FALLBACK_AVATAR;
    } catch(e) { return FALLBACK_AVATAR; }
  }

  function getAuthorName(post) {
    try { return post._embedded.author[0].name; } catch(e) { return 'MantaLogger'; }
  }

  function getPrimaryCategory(post) {
    try { return post._embedded['wp:term'][0][0].name; } catch(e) { return ''; }
  }

  function getPrimaryCatId(post) {
    try { return post._embedded['wp:term'][0][0].id; } catch(e) { return 0; }
  }

  /* =============================================
     DOM-referencer
     ============================================= */
  var pillsWrap     = document.getElementById('mlbPills');
  var featuredWrap  = document.getElementById('mlbFeaturedWrap');
  var gridSection   = document.getElementById('mlbGridSection');
  var blogGrid      = document.getElementById('mlbBlogGrid');
  var loadMoreWrap  = document.getElementById('mlbLoadMoreWrap');
  var loadMoreBtn   = document.getElementById('mlbLoadMore');

  /* =============================================
     Byg HTML for featured kort
     ============================================= */
  function buildFeaturedCard(post) {
    var img     = getFeaturedImg(post);
    var author  = getAuthorName(post);
    var avatar  = getAvatar(post);
    var date    = fmtDate(post.date);
    var rt      = readTime(post.content.rendered);
    var cat     = getPrimaryCategory(post);
    var title   = stripHtml(post.title.rendered);
    var excerpt = stripHtml(post.excerpt.rendered).slice(0, 180) + (stripHtml(post.excerpt.rendered).length > 180 ? '…' : '');

    var a = document.createElement('a');
    a.href = post.link;
    a.className = 'featured-card';
    a.innerHTML =
      '<div class="featured-img" style="background-image:url(\'' + img + '\')"></div>' +
      '<div class="featured-overlay"></div>' +
      '<div class="featured-body">' +
        '<div class="card-author-row">' +
          '<img src="' + avatar + '" alt="' + author + '" class="avatar" />' +
          '<div>' +
            '<span class="author-name">' + author + '</span>' +
            '<span class="post-date">' + date + ' · ' + rt + '</span>' +
          '</div>' +
        '</div>' +
        (cat ? '<span class="card-tag">' + cat + '</span>' : '') +
        '<h2 class="featured-title">' + title + '</h2>' +
        '<p class="featured-excerpt">' + excerpt + '</p>' +
        '<span class="read-more">Read Article →</span>' +
      '</div>';
    return a;
  }

  /* =============================================
     Byg HTML for grid-kort
     ============================================= */
  function buildGridCard(post) {
    var img     = getFeaturedImg(post);
    var author  = getAuthorName(post);
    var avatar  = getAvatar(post);
    var date    = fmtDate(post.date);
    var cat     = getPrimaryCategory(post);
    var catId   = getPrimaryCatId(post);
    var title   = stripHtml(post.title.rendered);
    var excerpt = stripHtml(post.excerpt.rendered).slice(0, 130) + (stripHtml(post.excerpt.rendered).length > 130 ? '…' : '');

    var a = document.createElement('a');
    a.href = post.link;
    a.className = 'blog-card';
    a.setAttribute('data-cat-id', catId);
    a.style.animation = 'mlbFadeUp .35s ease forwards';
    a.innerHTML =
      '<div class="card-img" style="background-image:url(\'' + img + '\')"></div>' +
      '<div class="card-overlay"></div>' +
      '<div class="card-author-row">' +
        '<img src="' + avatar + '" alt="' + author + '" class="avatar" />' +
        '<div>' +
          '<span class="author-name">' + author + '</span>' +
          '<span class="post-date">' + date + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="card-body">' +
        (cat ? '<span class="card-tag">' + cat + '</span>' : '') +
        '<h3 class="card-title">' + title + '</h3>' +
        '<p class="card-excerpt">' + excerpt + '</p>' +
      '</div>';
    return a;
  }

  /* =============================================
     Hent kategorier og udfyld filter-pills
     ============================================= */
  function loadCategories() {
    fetch(apiBase + '/categories?per_page=50&hide_empty=true')
      .then(function(r){ return r.json(); })
      .then(function(cats) {
        // Fjern "Uncategorized" / id=1 hvis ønsket
        cats.forEach(function(cat) {
          if (cat.name.toLowerCase() === 'uncategorized') return;
          var btn = document.createElement('button');
          btn.className = 'pill';
          btn.setAttribute('data-cat-id', cat.id);
          btn.textContent = cat.name;
          pillsWrap.appendChild(btn);
        });
        // Bind click
        pillsWrap.querySelectorAll('.pill').forEach(function(pill) {
          pill.addEventListener('click', function() {
            pillsWrap.querySelectorAll('.pill').forEach(function(p){ p.classList.remove('active'); });
            pill.classList.add('active');
            currentCat  = parseInt(pill.getAttribute('data-cat-id') || '0', 10);
            currentPage = 1;
            loadPage(true);
          });
        });
      })
      .catch(function(){ /* kategorier ikke kritiske */ });
  }

  /* =============================================
     Hent posts fra WP REST API
     ============================================= */
  function fetchPosts(page, catId, callback) {
    var cacheKey = catId + '_' + page;
    if (allPostsCache[cacheKey]) {
      callback(null, allPostsCache[cacheKey].posts, allPostsCache[cacheKey].total);
      return;
    }

    // side 1 henter +1 ekstra for featured (kun ved "All" / catId=0)
    var isFeaturedPage = (page === 1 && catId === 0);
    var fetchCount = isFeaturedPage ? PER_PAGE + 1 : PER_PAGE;

    var url = apiBase + '/posts?_embed&per_page=' + fetchCount + '&page=' + page;
    if (catId) url += '&categories=' + catId;

    fetch(url)
      .then(function(r) {
        var tp = parseInt(r.headers.get('X-WP-TotalPages') || '1', 10);
        return r.json().then(function(data){ return { data: data, tp: tp }; });
      })
      .then(function(res) {
        allPostsCache[cacheKey] = { posts: res.data, total: res.tp };
        callback(null, res.data, res.tp);
      })
      .catch(function(err){ callback(err); });
  }

  /* =============================================
     Render første side (featured + grid)
     ============================================= */
  function loadPage(reset) {
    if (reset) {
      blogGrid.innerHTML = '';
      featuredWrap.innerHTML = '<div class="skeleton skeleton-featured"></div>';
      gridSection.style.display = 'none';
      loadMoreWrap.style.display = 'none';
    }

    fetchPosts(currentPage, currentCat, function(err, posts, tp) {
      if (err || !posts || !posts.length) {
        featuredWrap.innerHTML =
          '<div class="mlb-error"><strong>Ingen artikler fundet.</strong>' +
          (err ? '<br>Tjek at SITE_URL er sat korrekt og at WordPress REST API er aktivt.' : '') +
          '</div>';
        return;
      }

      totalPages = tp;

      // Featured: kun første post, kun på side 1, kun ved "All"
      if (currentPage === 1 && currentCat === 0) {
        var featured = posts[0];
        var gridPosts = posts.slice(1);
        featuredWrap.innerHTML = '';
        featuredWrap.appendChild(buildFeaturedCard(featured));
        renderGridPosts(gridPosts, reset);
      } else {
        // Filteret er aktiv — ingen featured, alle poster i grid
        if (currentPage === 1) {
          featuredWrap.innerHTML = '';
        }
        renderGridPosts(posts, reset);
      }

      // Load more knap
      var hasMore = currentPage < totalPages;
      loadMoreWrap.style.display = hasMore ? 'block' : 'none';
      if (hasMore) {
        loadMoreBtn.disabled = false;
        loadMoreBtn.textContent = 'Load More Articles';
      }
    });
  }

  function renderGridPosts(posts, reset) {
    if (reset) blogGrid.innerHTML = '';
    posts.forEach(function(post) {
      blogGrid.appendChild(buildGridCard(post));
    });
    gridSection.style.display = posts.length ? '' : 'none';
  }

  /* =============================================
     Load More
     ============================================= */
  if (loadMoreBtn) {
    loadMoreBtn.addEventListener('click', function() {
      loadMoreBtn.disabled = true;
      loadMoreBtn.textContent = 'Loading…';
      currentPage++;
      fetchPosts(currentPage, currentCat, function(err, posts, tp) {
        if (err || !posts) { currentPage--; loadMoreBtn.disabled = false; loadMoreBtn.textContent = 'Load More Articles'; return; }
        totalPages = tp;
        posts.forEach(function(post, i) {
          var card = buildGridCard(post);
          card.style.opacity = '0';
          card.style.transform = 'translateY(20px)';
          card.style.animation = 'none';
          blogGrid.appendChild(card);
          setTimeout(function(){
            card.style.transition = 'opacity .4s ease, transform .4s ease';
            card.style.opacity = '1';
            card.style.transform = 'translateY(0)';
          }, 20 + i * 60);
        });
        var hasMore = currentPage < totalPages;
        loadMoreWrap.style.display = hasMore ? 'block' : 'none';
        if (hasMore) { loadMoreBtn.disabled = false; loadMoreBtn.textContent = 'Load More Articles'; }
      });
    });
  }

  /* =============================================
     Start
     ============================================= */
  loadCategories();
  loadPage(true);

})();

/* =============================================
   Navbar scroll effect
   ============================================= */
(function () {
  var nav = document.getElementById('mlbNav');
  if (!nav) return;
  function onScroll() {
    if (window.scrollY > 40) nav.classList.add('scrolled');
    else nav.classList.remove('scrolled');
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
})();
</script>
